name: Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/workflow-widget-v2

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -alias androiddebugkey \
            -keystore app/debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug, O=Android, C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Gradle Build
        run: |
          cd web-ui && pnpm install && cd ..
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p apk-output
          # 多个 ABI split 会生成多个 APK，cp 到目录再选 universal 的改名
          cp app/build/outputs/apk/debug/*.apk apk-output/
          if ls apk-output/*universal*.apk 1>/dev/null 2>&1; then
            mv apk-output/*universal*.apk "apk-output/OrangeChat-v${VERSION}.apk"
          else
            # 没有 universal 就取第一个
            FIRST=$(ls apk-output/*.apk | head -1)
            mv "$FIRST" "apk-output/OrangeChat-v${VERSION}.apk"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OrangeChat-v${{ env.VERSION }}
          path: apk-output/*.apk
